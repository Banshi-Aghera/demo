name: societycart
description: SocietyCart - shopping for apartment societies, with Neighbour Drop, Lending and Group Buy.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  # Firebase
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  google_sign_in: ^7.1.0
  # State and navigation
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0
  go_router: ^16.2.0
  # Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  # UI and utils
  google_fonts: ^6.3.0
  shared_preferences: ^2.5.3
  connectivity_plus: ^6.1.5
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  intl: ^0.20.2
  # Phase 3
  cloud_functions: ^6.0.0
  firebase_messaging: ^16.0.0
  firebase_storage: ^13.0.0
  razorpay_flutter: ^1.4.0
  image_picker: ^1.2.0
  pdf: ^3.11.3
  printing: ^5.14.2
  lottie: ^3.3.1
  # Phase 4 (admin)
  fl_chart: ^1.0.0
  csv: ^6.0.0
  file_saver: 0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.0
  freezed: ^3.1.0
  json_serializable: ^6.10.0
  riverpod_generator: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
